name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - name: Verify upstream archive
        run: python3 scripts/sync_upstream.py --check
      - name: Regenerate package
        run: python3 scripts/port.py
      - name: Check upstream Cursor name coverage
        run: python3 scripts/check_cursor_terms.py
      - name: Validate plugin manifest and skills
        run: python3 scripts/run_plugin_validator.py plugins/pstack-codex
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
