name: Check upstream pstack

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-pstack
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - name: Refresh from the upstream branch head
        run: python3 scripts/sync_upstream.py --latest --refresh
      - name: Render the compatibility report when upstream changed
        run: |
          if git diff --quiet -- config/upstream.json vendor/cursor-plugins/pstack plugins/pstack-codex; then
            echo "Upstream is unchanged; keeping the existing report."
          else
            python3 scripts/render_upstream_report.py --base HEAD
          fi
      - name: Validate the generated package
        run: |
          python3 scripts/run_plugin_validator.py plugins/pstack-codex
          python3 -m unittest discover -s tests -v
      - name: Open or update a review PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_BRANCH: automation/upstream-pstack
        run: |
          if git diff --quiet; then
            echo "Upstream is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$UPDATE_BRANCH"
          git add config/upstream.json config/hashes/upstream.sha256 vendor/cursor-plugins/pstack plugins/pstack-codex docs/UPSTREAM_REPORT.md
          git commit -m "chore: sync upstream pstack"
          git push --force-with-lease origin "HEAD:$UPDATE_BRANCH"
          if [ "$(gh pr list --head "$UPDATE_BRANCH" --base main --state open --json number --jq 'length')" = "0" ]; then
            gh pr create \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "chore: sync upstream pstack" \
              --body "Automated upstream refresh. Review vendor and generated diffs; this workflow never enables auto-merge."
          fi
